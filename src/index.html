<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neurone</title>
  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar">
      <div class="side-head" data-tauri-drag-region>
        <div class="brand" data-tauri-drag-region>
          <span class="brand-mark" id="brandMark"></span>
          <span class="brand-name">Neurone</span>
        </div>
        <button class="icon-btn" id="collapseBtn" title="Réduire la barre latérale"></button>
      </div>


      <div class="side-scroll">
                <nav class="nav" id="nav"></nav>

        <div class="side-label side-label-row">
          <span>Domaines</span>
          <button class="mini-btn" id="addDomainSide" title="Nouveau domaine"></button>
        </div>
        <div class="nav" id="domainNav"></div>
      </div>

      <nav class="nav side-bottom" id="navBottom"></nav>
      <button class="side-foot" id="profileBtn" title="Modifier le profil">
        <span id="profileAvatar"></span>
        <span class="who">
          <span class="who-name" id="profileName">Camarade</span>
          <span class="who-sub" id="streakLabel"></span>
        </span>
      </button>
    </aside>

    <section class="main">
      <header class="topbar" data-tauri-drag-region>
        <div class="crumbs" id="crumbs" data-tauri-drag-region></div>
        <div class="bar-title" id="barTitle" data-tauri-drag-region></div>
        <div class="win-controls">
          <button class="dot dot-min" id="winMin" title="Réduire"></button>
          <button class="dot dot-max" id="winMax" title="Agrandir"></button>
          <button class="dot dot-close" id="winClose" title="Fermer"></button>
        </div>
      </header>
      <div class="read-progress" id="readProg" hidden><i></i></div>
      <main class="view" id="view"></main>
    </section>
  </div>

  <div class="modal-root" id="modalRoot" hidden></div>
  <div class="toasts" id="toasts"></div>
  <input type="file" id="fileInput" accept=".json,application/json" hidden>

  <script type="module" src="js/app.js"></script>
</body>
</html>
