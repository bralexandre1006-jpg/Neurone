name: Build Windows

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - run: npx tauri build

      - name: Préparer l'installeur
        id: prep
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p dist
          cp src-tauri/target/release/bundle/nsis/*-setup.exe dist/Neurone-Setup.exe
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Neurone-Setup
          path: dist/Neurone-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publier la Release (nouvelle version uniquement)
        if: steps.prep.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.prep.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Neurone v${{ steps.prep.outputs.version }}
          body: |
            Installeur Windows de Neurone v${{ steps.prep.outputs.version }}.
            Télécharge Neurone-Setup.exe, double-clique : c'est installé, avec une icône sur le bureau.
          files: dist/Neurone-Setup.exe
          make_latest: true
